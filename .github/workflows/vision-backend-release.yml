name: Vision backend

on:
  workflow_dispatch:
  push:
    branches:
      - "vision/instruction-control-v1"
    tags:
      - "vision-*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            rid: win-x64
            executable: payload/netcoredbg.exe
            hot-reload: "true"
          - runner: ubuntu-24.04
            rid: linux-x64
            executable: payload/netcoredbg
            hot-reload: "false"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\payload"
          -DCMAKE_BUILD_TYPE=Release

      - name: Configure
        if: runner.os == 'Linux'
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build -G "Unix Makefiles"
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/payload"
          -DCMAKE_BUILD_TYPE=Release

      - name: Build complete backend payload
        run: cmake --build build --config Release --target install --parallel

      - name: Verify Vision DAP protocol
        run: >-
          python tools/test_vision_hot_reload_dap.py
          ${{ matrix.executable }}
          ${{ matrix.hot-reload }}

      - name: Build instruction-control fixture
        run: dotnet build tools/fixtures/vision_instruction_control/VisionInstructionControlFixture.csproj --configuration Debug

      - name: Verify Vision instruction control
        run: >-
          python tools/test_vision_instruction_control_dap.py
          ${{ matrix.executable }}
          tools/fixtures/vision_instruction_control/bin/Debug/net10.0/VisionInstructionControlFixture.dll
          tools/fixtures/vision_instruction_control/Program.cs

      - name: Package payload and provenance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE payload/LICENSE-netcoredbg.txt
          @"
          Vision netcoredbg backend
          Fork commit: $env:GITHUB_SHA
          Upstream tag: 3.2.0-1092
          Upstream commit: 9744e1f051866215611b8440c638042aa2aa2f72
          Vision Hot Reload DAP protocol: 1
          Vision Instruction Pointer DAP protocol: 1
          "@ | Set-Content payload/VISION-PROVENANCE.txt -Encoding utf8
          Compress-Archive -Path payload/* -DestinationPath vision-netcoredbg-win-x64.zip
          (Get-FileHash vision-netcoredbg-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content vision-netcoredbg-win-x64.zip.sha256 -Encoding ascii

      - name: Package payload and provenance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp LICENSE payload/LICENSE-netcoredbg.txt
          cat > payload/VISION-PROVENANCE.txt <<EOF
          Vision netcoredbg backend
          Fork commit: $GITHUB_SHA
          Upstream tag: 3.2.0-1092
          Upstream commit: 9744e1f051866215611b8440c638042aa2aa2f72
          Vision Hot Reload DAP protocol: unavailable
          Vision Instruction Pointer DAP protocol: 1
          EOF
          tar -C payload -czf vision-netcoredbg-linux-x64.tar.gz .
          sha256sum vision-netcoredbg-linux-x64.tar.gz | cut -d ' ' -f 1 > vision-netcoredbg-linux-x64.tar.gz.sha256

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: vision-netcoredbg-${{ matrix.rid }}.*

      - uses: actions/upload-artifact@v4
        with:
          name: vision-netcoredbg-${{ matrix.rid }}
          path: |
            vision-netcoredbg-${{ matrix.rid }}.*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vision-netcoredbg-*
          merge-multiple: true

      - name: Publish tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 ||
            gh release create "${{ github.ref_name }}" --verify-tag --generate-notes
          gh release upload "${{ github.ref_name }}" vision-netcoredbg-* --clobber

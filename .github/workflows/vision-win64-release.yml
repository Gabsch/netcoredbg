name: Vision Win64 backend

on:
  workflow_dispatch:
  push:
    tags:
      - "vision-*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-win64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\payload"
          -DCMAKE_BUILD_TYPE=Release

      - name: Build complete backend payload
        run: cmake --build build --config Release --target install --parallel

      - name: Verify Vision DAP protocol
        run: python tools/test_vision_hot_reload_dap.py payload/netcoredbg.exe

      - name: Package payload and provenance
        shell: pwsh
        run: |
          Copy-Item LICENSE payload/LICENSE-netcoredbg.txt
          @"
          Vision netcoredbg backend
          Fork commit: $env:GITHUB_SHA
          Upstream tag: 3.2.0-1092
          Upstream commit: 9744e1f051866215611b8440c638042aa2aa2f72
          Vision Hot Reload DAP protocol: 1
          "@ | Set-Content payload/VISION-PROVENANCE.txt -Encoding utf8
          Compress-Archive -Path payload/* -DestinationPath vision-netcoredbg-win-x64.zip
          (Get-FileHash vision-netcoredbg-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content vision-netcoredbg-win-x64.zip.sha256 -Encoding ascii

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: vision-netcoredbg-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vision-netcoredbg-win-x64
          path: |
            vision-netcoredbg-win-x64.zip
            vision-netcoredbg-win-x64.zip.sha256

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          vision-netcoredbg-win-x64.zip
          vision-netcoredbg-win-x64.zip.sha256
          --verify-tag
          --generate-notes
